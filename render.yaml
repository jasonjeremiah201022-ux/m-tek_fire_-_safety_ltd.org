# ============================================================================
# M-TEK Data API — one-click deploy (NO bash required)
#
# 1. Push this repo to GitHub (already done).
# 2. Go to https://dashboard.render.com → New + → Blueprint
# 3. Select NO-Group/m-tek_fire_safety_ltd.org (branch arena/… or main)
# 4. Render reads this file and creates the service.
# 5. In the service → Environment, add:
#      MONGODB_URI        = mongodb+srv://nogroup_db_user:…@mfsl.w5ifd7x.mongodb.net/
#      SUPABASE_URL       = https://kshuadjcflwlidupnqly.supabase.co
#      SUPABASE_SECRET_KEY= sb_secret_…
#      MTEK_CEO_UID       = d9c7fd50-0a60-4a16-b4ab-041cb568a49b
#      MTEK_CEO_SIG       = (the CEO signature passcode)
# 6. Deploy → open the URL → you should see the M-TEK Data API page.
#    First request auto-creates the 7 section databases, zeroes the serial
#    books (000000001) and provisions the catalogue + CEO profile.
# 7. Build the app with MILS_API_BASE=https://<your-service>.onrender.com
#    (set it as a GitHub Variable — see docs/ci/build-app.yml).
# ============================================================================
services:
  - type: web
    name: mtek-data-api
    runtime: node
    plan: free
    rootDir: backend/api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MTEK_CEO_UID
        sync: false
      - key: MTEK_CEO_SIG
        sync: false
