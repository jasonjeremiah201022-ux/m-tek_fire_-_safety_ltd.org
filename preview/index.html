<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M-Tek Inventory — App Preview</title>
  <meta name="description" content="M1 design preview of the M-Tek Inventory app (Flutter). Mirrors lib/ screens with sample data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.png" alt="M-Tek logo">
        <div>
          <div class="t1">M-Tek Inventory</div>
          <div class="t2">Fire &amp; Safety Ltd</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="foot">
        <div class="avatar">A</div>
        <div>
          <div style="color:#e2e8f0;font-weight:600">Admin</div>
          <div>M1 preview · sample data</div>
        </div>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <button class="hamb" onclick="openDrawer()">☰</button>
        <span class="pagetitle" id="pagetitle">Insights</span>
        <span class="spacer"></span>
        <span class="bell">🔔</span>
        <span class="userchip" id="userchip"><span class="uname" id="uname"></span><span class="urole" id="urole"></span></span>
        <button class="logoutbtn" id="logoutbtn" onclick="signOut()" title="Sign out">⏻</button>
      </div>
      <div class="content" id="app"></div>
    </div>
  </div>

  <!-- mobile drawer -->
  <div class="drawer-back" id="drawer-back" onclick="closeDrawer()"></div>
  <nav class="m-drawer" id="m-drawer">
    <div class="brand">
      <img src="logo.png" alt="M-Tek logo">
      <div><div class="t1" style="color:#fff">M-Tek Inventory</div><div class="t2">Fire &amp; Safety Ltd</div></div>
    </div>
    <div class="nav" id="m-nav"></div>
  </nav>

  <!-- auth layer (login / create account with Signature Passcode) -->
  <div id="auth"></div>

  <script src="app.js"></script>
</body>
</html>
